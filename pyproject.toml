[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-news-editor-bot"
version = "0.1.0"
description = "Semi-automated economic news editor bot for Telegram channels."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "httpx>=0.27",
    "lxml>=5.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    "rich>=13.7",
    "rq>=1.16",
    "sqlalchemy>=2.0",
    "trafilatura>=1.12",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
newsbot = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.llm" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
