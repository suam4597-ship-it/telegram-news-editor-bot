sources:
  # Main domestic discovery source. Naver News API is used for finding
  # investment-relevant articles, not for reposting full article text.
  - name: "Naver News - investment query packs"
    type: "naver_news"
    category: "stock"
    country: "KR"
    language: "ko"
    reliability_score: 0.72
    crawl_interval_minutes: 15
    license_status: "link_only"
    is_active: true
    crawl_mode: "api"
    template_policy: "auto"
    requires_approval: true
    cooldown_minutes: 180
    commercial_use_status: "link_only"
    auto_publish_allowed: false
    rate_limit:
      requests_per_minute: 20
    options:
      provider: "Naver"
      query_config_path: "config/source_queries.yml"
      query_packs:
        - "company_events"
        - "semiconductor_ai"
        - "battery_ev"
        - "defense_shipbuilding_energy"
        - "bio_healthcare"
        - "geopolitics_supply_chain"
        - "global_company_to_korea"
      exclude_domains:
        - "blog.naver.com"
        - "cafe.naver.com"
        - "post.naver.com"

  # Foreign RSS: use only official/public feeds and keep every item under
  # admin approval. Summaries must add a domestic sector/company connection.
  - name: "CNBC Markets RSS"
    type: "rss"
    feed_url: "https://www.cnbc.com/id/10001147/device/rss/rss.html"
    category: "us_market"
    country: "US"
    language: "en"
    reliability_score: 0.78
    crawl_interval_minutes: 20
    license_status: "link_only"
    is_active: true
    crawl_mode: "rss"
    template_policy: "auto"
    requires_approval: true
    cooldown_minutes: 180
    commercial_use_status: "unknown"
    auto_publish_allowed: false
    rate_limit:
      requests_per_minute: 6
    options:
      provider: "CNBC"
      lane: "미국장/글로벌 시장"

  - name: "CNBC Technology RSS"
